{% extends 'base.html' %}
{% block title %}无权限访问{% endblock %}
{% block content %}
<div class="panel panel-default forbidden-panel">
    <div class="panel-body text-center">
        <div class="forbidden-code">403</div>
        <h3>抱歉，您没有访问该功能的权限</h3>
        <p class="text-muted">所需权限编码：{{ required_code }}，请联系超级管理员分配角色或权限。</p>
        <a href="{% url 'index' %}" class="btn btn-primary">返回首页</a>
    </div>
</div>
{% endblock %}
