{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
    <div class="actions">
        <a href="{% url 'employee_list' %}" class="btn btn-default">
            <span class="glyphicon glyphicon-arrow-left"></span> 返回列表
        </a>
    </div>
</div>

<div class="panel panel-default">
    <div class="panel-body">
        <form method="post" enctype="multipart/form-data" class="form-horizontal" style="max-width: 720px;">
            {% csrf_token %}
            {% if employee and employee.avatar %}
            <div class="form-group">
                <label class="col-sm-2 control-label">当前头像</label>
                <div class="col-sm-10">
                    <img src="{{ employee.avatar.url }}" class="avatar avatar-lg" alt="{{ employee.name }}">
                </div>
            </div>
            {% endif %}
            {% include 'partials/form_fields.html' with form=form %}
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{% url 'employee_list' %}" class="btn btn-default">取消</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
